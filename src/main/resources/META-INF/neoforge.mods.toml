displayName="Create: Wire Rider"
updateJSONURL="https://raw.githubusercontent.com/kvizoid/create-wire-rider/main/updates.json"
displayURL="https://github.com/kvizoid/create-wire-rider"
logoFile="logo.png"
credits="George_VI (Electro Energetics), Patryk3211 (Power Grid), Simibubi (Create)"
authors="white, drnight"
description='''
Zipline on power lines using any Create wrench.
Works with both Create: Electro Energetics and Create: Power Grid cables.
Bare wires carrying live voltage require quick reactions (Space / LMB / RMB) to avoid taking electric damage, while A/D switch between parallel lines.
'''

